<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Deep Research Agent —— 输入一个主题，自动完成规划、并行检索、分段摘要与报告撰写，全过程实时可见。"
    />
    <meta name="color-scheme" content="dark light" />
    <title>Deep Research Agent · 深度研究助手</title>
    <script>
      // 在样式生效前定好主题，避免深色偏好下先闪一屏白
      (function () {
        try {
          var saved = localStorage.getItem("dr-theme");
          var prefersLight =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = saved || (prefersLight ? "light" : "dark");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      html {
        background: #0a0e16;
      }
      html[data-theme="light"] {
        background: #f5f7fb;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>本界面需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
